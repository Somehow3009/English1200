services:
  - type: web
    name: english1200
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: COOKIE_SECURE
        value: 1
# Ghi chú: gói free của Render không giữ file SQLite khi restart.
# Cần lưu lâu dài: gắn Disk (trả phí) hoặc chuyển DB sang Postgres miễn phí.
