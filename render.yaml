services:
  - type: web
    name: english1200
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MASTER_SECRET
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: COOKIE_SECURE
        value: 1
# Dữ liệu nằm ở Supabase (Postgres) nên gói free restart thoải mái không mất gì.
